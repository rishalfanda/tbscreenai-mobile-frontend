name: frontend

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          # Pinned to the version this project is developed against. Drift's
          # generated code is tied to its analyzer, so a floating SDK turns
          # every unrelated PR into a codegen debugging session.
          flutter-version: "3.44.7"
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Verify generated code is current
        # app_database.g.dart is committed. If someone edits tables.dart and
        # forgets `dart run build_runner build`, the checked-in code silently
        # disagrees with the schema — catch it here rather than at runtime.
        run: |
          dart run build_runner build --delete-conflicting-outputs
          git diff --exit-code -- lib/data/local/app_database.g.dart

      - name: Test
        # Pixel baselines were reviewed on Windows. Functional coverage stays
        # on Linux; the golden job below is a separate, non-optional gate.
        run: flutter test --exclude-tags golden

  golden:
    name: Windows golden tests
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.7"
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Compare reviewed Windows baselines
        # Never regenerate baselines or relax the comparator in CI.
        run: flutter test --tags golden

      - name: Preserve golden failure images
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: windows-golden-failures
          path: test/failures/
          if-no-files-found: ignore
