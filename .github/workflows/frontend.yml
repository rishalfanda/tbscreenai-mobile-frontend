name: frontend

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          # Pinned to the version this project is developed against. Drift's
          # generated code is tied to its analyzer, so a floating SDK turns
          # every unrelated PR into a codegen debugging session.
          flutter-version: "3.44.7"
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Verify generated code is current
        # app_database.g.dart is committed. If someone edits tables.dart and
        # forgets `dart run build_runner build`, the checked-in code silently
        # disagrees with the schema — catch it here rather than at runtime.
        run: |
          dart run build_runner build --delete-conflicting-outputs
          git diff --exit-code -- lib/data/local/app_database.g.dart

      - name: Test
        run: flutter test
