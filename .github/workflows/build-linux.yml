name: Build Linux Desktop

on:
  workflow_dispatch:
  push:
    branches: [main, master, mlops]
    paths:
      - 'lib/**'
      - 'linux/**'
      - 'pubspec.yaml'
      - '.github/workflows/build-linux.yml'

jobs:
  build-linux:
    name: Build Linux Desktop Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libsecret-1-dev \
            libjsoncpp-dev libsqlite3-dev

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Enable Linux Desktop
        run: flutter config --enable-linux-desktop

      - name: Install dependencies
        run: flutter pub get

      - name: Build Linux Desktop Bundle
        run: flutter build linux --release

      - name: Archive Linux Release Bundle
        run: |
          cd build/linux/x64/release
          tar -czvf tbscreen-linux-x64.tar.gz bundle/

      - name: Upload Linux Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: tbscreen-linux-x64
          path: build/linux/x64/release/tbscreen-linux-x64.tar.gz
          retention-days: 14

