name: myapp
description: TBScreen tablet UI scaffold.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter
  go_router: ^15.1.2
  provider: ^6.1.2
  dio: ^5.7.0
  drift: ^2.34.2
  drift_flutter: ^0.3.1
  camera: ^0.12.0+2
  crypto: ^3.0.7
  image_picker: ^1.2.3
  connectivity_plus: ^6.1.0
  flutter_onnxruntime: ^1.8.4
  archive: ^3.6.1
  ed25519_edwards: ^0.3.1
  image: ^4.3.0
  path_provider: ^2.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.34.5
  build_runner: ^2.15.1
  change_app_package_name: ^1.5.0
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/sample/
    - assets/icon/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/icon.png"
  min_sdk_android: 21

  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icon/icon.png"